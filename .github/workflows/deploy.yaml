name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Typst
        uses: typst-community/setup-typst@v5

      - name: Compile PDF and Create Redirect
        run: |
          mkdir dist

          FILENAME="$(yq '.title' config.yaml).pdf"
          
          typst compile resume.typ "dist/$FILENAME"
          echo "<meta http-equiv=\"refresh\" content=\"0; url=./${FILENAME}\">" > dist/index.html

      - name: Upload PDF artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          name: github-pages
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
