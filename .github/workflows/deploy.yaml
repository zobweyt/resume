name: Deploy

on:
  push:
    branches: 
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Typst
        uses: typst-community/setup-typst@v5

      - name: Compile PDF
        run: typst compile resume.typ "Резюме Газиев Никита Frontend.pdf"

      - name: Create redirect
        run: echo '<meta http-equiv="refresh" content="0; url=./Резюме Газиев Никита Frontend.pdf">' > index.html

      - name: Upload PDF artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
          name: github-pages
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
